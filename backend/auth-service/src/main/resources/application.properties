spring.application.name=auth-service
server.port=8081

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/docusing}
spring.datasource.username=docusing
spring.datasource.password=docusing
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.out-of-order=true
spring.flyway.validate-on-migrate=false
spring.flyway.table=flyway_schema_history_auth
spring.flyway.baseline-version=0

# Spring Cloud
spring.cloud.compatibility-verifier.enabled=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

## H2 console disabled (using PostgreSQL)
spring.h2.console.enabled=false

jwt.secret=change-this-secret
jwt.expiration-minutes=60
jwt.refresh-expiration-minutes=10080

notification.service.base-url=${NOTIFICATION_SERVICE_BASE_URL:http://localhost:8084}
app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:3000}

magic-link.expiration-minutes=15
magic-link.resend-minutes=5

# Modo desarrollo (desactivar para requerir password en login)
auth.dev-mode=false
