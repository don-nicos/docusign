spring.application.name=payment-service
server.port=8085

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/docusing}
spring.datasource.username=docusing
spring.datasource.password=docusing
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/payment
spring.flyway.table=flyway_payment_schema_history
spring.flyway.baseline-on-migrate=true
spring.flyway.create-schemas=true
spring.flyway.schemas=payment
spring.flyway.default-schema=payment
spring.flyway.out-of-order=true
spring.flyway.validate-on-migrate=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=payment
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

spring.cloud.compatibility-verifier.enabled=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

## H2 console disabled (using PostgreSQL)
spring.h2.console.enabled=false

mercadopago.enabled=${MERCADOPAGO_ENABLED:false}
mercadopago.client=${MERCADOPAGO_CLIENT:sdk}
mercadopago.base-url=${MERCADOPAGO_BASE_URL:https://api.mercadopago.com}
mercadopago.public-key=${MELI_PUBLIC_KEY:}
mercadopago.access-token=${MELI_ACCESS_TOKEN:}
mercadopago.webhook-secret=${MERCADOPAGO_WEBHOOK_SECRET:}
mercadopago.notification-url=${MERCADOPAGO_NOTIFICATION_URL:http://localhost:8085/api/payments/webhooks/mercadopago}

app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:3000}
notification.service.base-url=${NOTIFICATION_SERVICE_BASE_URL:http://localhost:8084}
auth.service.base-url=${AUTH_SERVICE_BASE_URL:http://localhost:8081}

server.error.include-message=always
server.error.include-exception=true
server.error.include-stacktrace=always

payment.reminders.enabled=true
payment.reminders.days-before-expiry=7,3,1

logging.level.com.docusing=INFO
logging.level.com.docusing.payment.infrastructure.tracing=DEBUG
logging.file.name=logs/payment-service.log
logging.logback.rollingpolicy.file-name-pattern=logs/payment-service.%d{yyyy-MM-dd}.log
logging.logback.rollingpolicy.max-history=30
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p %X{traceId:- NO_TRACE} --- [%15.15t] %-40.40logger{39} : %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}
logging.pattern.file=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p %X{traceId:- NO_TRACE} --- [%t] %-40.40logger{39} : %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}
