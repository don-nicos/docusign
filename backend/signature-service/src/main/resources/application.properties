spring.application.name=signature-service
server.port=8083

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/docusing}
spring.datasource.username=docusing
spring.datasource.password=docusing
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=true
spring.flyway.validate-on-migrate=false
spring.flyway.table=flyway_schema_history_signature
spring.flyway.baseline-version=0
spring.cloud.compatibility-verifier.enabled=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

## H2 console disabled (using PostgreSQL)
spring.h2.console.enabled=false

document.service.base-url=${DOCUMENT_SERVICE_BASE_URL:http://localhost:8082}
notification.service.base-url=${NOTIFICATION_SERVICE_BASE_URL:http://localhost:8084}
payment.service.base-url=${PAYMENT_SERVICE_BASE_URL:http://localhost:8085}

app.free-tier.max-documents=3

# URL base del frontend para construir magic links de firma
app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:3000}

# Política de orden de firma (true = exigir orden; false = permitir fuera de orden)
signature.enforce-order=false

signature.backfill-enabled=true
signature.backfill-batch-size=20
signature.backfill-fixed-delay-ms=600000

# Configuración de recordatorios automáticos
signature.reminders.enabled=true
signature.reminders.days-before-first-reminder=3
signature.reminders.days-between-reminders=2
signature.reminders.max-reminders=5
signature.reminders.cron-expression=0 0 9 * * ?

# Configuración de AWS S3 (usar AWS real vía variables de entorno)
# Dejar endpoint en blanco para usar el endpoint de AWS por defecto
aws.s3.endpoint=
aws.s3.region=us-east-2
# Credenciales se leen desde variables de entorno:
#   AWS_S3_ACCESS_KEY -> aws.s3.access-key
#   AWS_S3_SECRET_KEY -> aws.s3.secret-key
# No definir valores por defecto aquí para evitar usarlos accidentalmente
# aws.s3.access-key=
# aws.s3.secret-key=
# Buckets solicitados
aws.s3.bucket.signed-pdfs=docusing-dev
aws.s3.bucket.signatures=docusing-dev
